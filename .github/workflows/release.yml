name: Release

# 推送 v* tag 自动触发；支持手动触发；普通 push 不触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: ${{ matrix.name }}
    strategy:
      # 单个平台失败不取消其他平台的构建
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（M 系列芯片）
          - name: macOS aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # macOS Intel（在 ARM runner 上交叉编译，独立产物）
          - name: macOS x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            target: ''
            args: ''
          - name: Ubuntu
            platform: ubuntu-latest
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 更新签名私钥（可选，在仓库 Secrets 中配置；
          # 留空则不生成 .sig 签名文件，不影响正常打包。不做代码签名/公证）
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # 自动创建 GitHub Release 并上传全部构建产物
          release: true
          # __VERSION__ 自动替换为 tauri.conf.json 中的版本号
          tagName: v__VERSION__
          releaseName: 'TDengine Viewer v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
